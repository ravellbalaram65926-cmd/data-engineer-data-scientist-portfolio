name: Dependency audit

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - retail-demand-forecasting
          - real-time-fraud-detection
          - end-to-end-mlops-platform
          - customer-analytics-warehouse
          - rag-document-search-pipeline
          - recommendation-engine-at-scale
          - iot-energy-demand-forecasting
          - data-quality-and-anomaly-monitoring
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt

      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies
        run: python -m pip_audit --strict -r "${{ matrix.project }}/requirements.txt"
