name: Portfolio CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Validate Python files
        run: |
          python -m compileall .
